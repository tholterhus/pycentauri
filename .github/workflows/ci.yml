name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: "test (py${{ matrix.python-version }}, ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Private repository: Actions minutes are billed and macOS counts
        # at a 10x multiplier, so the matrix is deliberately small.
        # - 3.13 = the production environment (Debian 13, this project's own host)
        # - 3.11 = Raspberry Pi OS Bookworm / older distribution Pythons
        # The Coral detection itself is Python-version-agnostic (the Edge TPU
        # runtime is a C library; LiteRT ships wheels for 3.10-3.13).
        os: [ubuntu-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp,dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest --cov=pycentauri --cov-report=term-missing
